<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" role="img" aria-label="Le pont diviseur ramène 3,3 V à environ 0,6 V">
<style>
  text { font-family: Atkinson Hyperlegible, system-ui, -apple-system, Segoe UI, sans-serif; }
  .ink { fill: #1E2320; } .muted { fill: #59605B; }
  .s-ink { stroke: #1E2320; } .s-edge { stroke: #9EA39C; } .s-grid { stroke: #D3D6D0; }
  .s-acc { stroke: #16833F; } .f-acc { fill: #16833F; } .f-acc-t { fill: #16833F; fill-opacity: .14; }
  .s-syn { stroke: #A85F0A; } .f-syn-t { fill: #A85F0A; fill-opacity: .16; }
  .f-tint { fill: #D9DCD5; } .f-edge { fill: #9EA39C; }
  @media (prefers-color-scheme: dark) {
    .ink { fill: #E5E8E3; } .muted { fill: #A1A8A2; }
    .s-ink { stroke: #E5E8E3; } .s-edge { stroke: #6B716C; } .s-grid { stroke: #3A3F3B; }
    .s-acc { stroke: #3ED97A; } .f-acc { fill: #3ED97A; } .f-acc-t { fill: #3ED97A; fill-opacity: .16; }
    .s-syn { stroke: #E39A3B; } .f-syn-t { fill: #E39A3B; fill-opacity: .2; }
    .f-tint { fill: #2C302D; } .f-edge { fill: #6B716C; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"/></marker></defs>
<text x="24" y="32" class="ink" font-size="15" font-weight="700" text-anchor="start">330 Ω + les 75 Ω du projecteur ramènent 3,3 V à environ 0,6 V</text>
<rect x="508" y="96" width="228" height="272" rx="8" fill="none" class="s-edge" stroke-dasharray="5 4"/>
<text x="524" y="120" class="ink" font-size="13" font-weight="700" text-anchor="start">Projecteur</text>
<text x="524" y="138" class="muted" font-size="11.5" font-weight="400" text-anchor="start">entrée du vert, déjà intégrée</text>
<g fill="none" class="s-ink" stroke-width="1.5"><path d="M184 176H248"/><path d="M328 176H580V216"/><path d="M580 296V336"/><path d="M104 212V336H580"/></g>
<rect x="24" y="140" width="160" height="72" rx="8" fill="none" class="s-edge" stroke-width="1.25"/>
<text x="104" y="164" class="ink" font-size="13" font-weight="700" text-anchor="middle">Sortie GREEN</text>
<text x="104" y="180" class="ink" font-size="11.5" font-weight="400" text-anchor="middle">FPGA, PIN_A2</text>
<text x="104" y="196" class="muted" font-size="11.5" font-weight="400" text-anchor="middle">0 V ou 3,3 V</text>
<rect x="248" y="164" width="80" height="24" fill="none" class="s-acc" stroke-width="2"/>
<text x="288" y="154" class="ink" font-size="13" font-weight="700" text-anchor="middle">R = 330 Ω</text>
<text x="288" y="208" class="muted" font-size="11.5" font-weight="400" text-anchor="middle">sur la breadboard</text>
<circle cx="404" cy="176" r="4" class="ink"/>
<text x="404" y="154" class="ink" font-size="13" font-weight="700" text-anchor="middle">Borne 2 du VGA</text>
<text x="404" y="198" class="ink" font-size="11.5" font-weight="400" text-anchor="middle">≈ 0,6 V si GREEN = 1</text>
<rect x="568" y="216" width="24" height="80" fill="none" class="s-edge" stroke-width="1.5"/>
<text x="604" y="252" class="ink" font-size="13" font-weight="700" text-anchor="start">75 Ω</text>
<text x="604" y="268" class="muted" font-size="11.5" font-weight="400" text-anchor="start">vers la masse</text>
<g class="s-ink" stroke-width="1.5"><line x1="566" x2="594" y1="342" y2="342"/><line x1="572" x2="588" y1="348" y2="348"/><line x1="577" x2="583" y1="354" y2="354"/></g>
<text x="120" y="326" class="muted" font-size="11.5" font-weight="400" text-anchor="start">masse commune : JP1 broche 12 vers bornes 5, 6, 7, 8, 10</text>
<text x="24" y="396" class="ink" font-size="13" font-weight="400" text-anchor="start">V = 3,3 × 75 / (330 + 75) ≈ 0,61 V, sous le maximum de 0,7 V</text>
<text x="24" y="416" class="muted" font-size="11.5" font-weight="400" text-anchor="start">Mesuré ≈ 0,54 V : sous charge, la sortie du FPGA descend à environ 2,9 V. HSYNC et VSYNC passent sans résistance.</text>
</svg>
